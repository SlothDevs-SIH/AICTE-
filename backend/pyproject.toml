[project]
name = "samanvay-backend"
version = "0.1.0"
description = "SAMANVAY backend (AICTE complaint coordination) - phase B1"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2.0,<2.1", "alembic",
  "pydantic-settings", "argon2-cffi", "rapidfuzz", "cryptography", "pyjwt",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
